<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Beautiful Savage</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Orbitron:wght@500;700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --void-black: #050505;
            --gold-primary: #d4af37;
            --gold-light: #f9e076;
            --teal-accent: #0d9488;
            --starlight: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--void-black);
            color: var(--starlight);
            font-family: 'Space Mono', monospace;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .auth-container, .admin-panel {
            max-width: 500px;
            margin: 40px auto;
            background: rgba(26,10,46,0.5);
            border: 1px solid rgba(212,175,55,0.3);
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.6rem;
        }

        label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            color: var(--teal-accent);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(5,5,5,0.8);
            border: 1px solid rgba(212,175,55,0.3);
            color: var(--starlight);
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(74,20,140,0.4));
            border: 1px solid var(--gold-primary);
            color: var(--gold-light);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
        }

        .admin-panel { display: none; }
        
        .status-msg {
            color: #4ade80;
            font-size: 0.75rem;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Lock Screen -->
    <div class="auth-container" id="authBox">
        <h1>Sanctum Admin</h1>
        <label>Enter Passcode</label>
        <input type="password" id="passInput" placeholder="Passcode...">
        <button class="btn" onclick="verifyPass()">Unlock Portal</button>
        <p id="errorMsg" style="color:#ef4444; font-size:0.7rem; margin-top:10px; text-align:center; display:none;">Invalid Passcode</p>
    </div>

    <!-- Admin Controls -->
    <div class="admin-panel" id="adminBox">
        <h1>Product Manager</h1>
        
        <label>Offering Title</label>
        <input type="text" id="pTitle" placeholder="e.g. Sacred Alignment Course">

        <label>Price ($ USD)</label>
        <input type="number" id="pPrice" placeholder="197">

        <label>PayPal Payment Link</label>
        <input type="text" id="pPaypal" placeholder="https://paypal.me/MelissaGutierrez575>

        <label>Description</label>
        <input type="text" id="pDesc" placeholder="Brief product summary...">

        <button class="btn" onclick="saveProduct()">Publish Offering</button>
        <div class="status-msg" id="statusMsg">Product Saved Successfully!</div>
        
        <a href="index.html" style="display:block; text-align:center; color:var(--gold-primary); font-size:0.7rem; margin-top:20px; text-decoration:none;">← Return to Sanctum</a>
    </div>

    <script>
        const SECRET_PASS = "savageworld";

        function verifyPass() {
            const val = document.getElementById('passInput').value;
            if (val === SECRET_PASS) {
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('adminBox').style.display = 'block';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function saveProduct() {
            const title = document.getElementById('pTitle').value;
            const price = document.getElementById('pPrice').value;
            const paypal = document.getElementById('pPaypal').value;
            const desc = document.getElementById('pDesc').value;

            if(!title || !price || !paypal) {
                alert("Please complete title, price, and payment link.");
                return;
            }

            let products = JSON.parse(localStorage.getItem('bs_products_v2')) || [];
            products.push({ title, price, paypal, desc, category: 'Digital Transmissions' });
            localStorage.setItem('bs_products_v2', JSON.stringify(products));

            document.getElementById('statusMsg').style.display = 'block';
            setTimeout(() => { document.getElementById('statusMsg').style.display = 'none'; }, 3000);

            document.getElementById('pTitle').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pPaypal').value = '';
            document.getElementById('pDesc').value = '';
        }
    </script>
</body>
</html>
